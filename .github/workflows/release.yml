name: Build & Release Nimbus

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Construir Instalador Windows (.exe)"
        required: true
        type: boolean
        default: true
      build_ubuntu:
        description: "Construir Pacote Ubuntu (.AppImage)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  build-windows:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_windows == 'true')
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -v

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm nimbus.spec

      - name: Extract Version
        id: version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            echo "VERSION=0.0.0-dev" >> $GITHUB_ENV
          fi

      - name: Compile Installer with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/nimbus.iss
          options: /dMyAppVersion=${{ env.VERSION }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nimbus-Windows-Setup
          path: dist-installer/*.exe
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*.exe
          generate_release_notes: true

  build-ubuntu:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_ubuntu == 'true')
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libgl1-mesa-glx libegl1 imagemagick fakeroot
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/ -v

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm nimbus.spec

      - name: Extract Version
        id: version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            echo "VERSION=0.0.0-dev" >> $GITHUB_ENV
          fi

      - name: Download linuxdeploy and linuxdeploy-plugin-qt
        run: |
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod a+x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Package AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copia arquivos compilados do PyInstaller
          cp -r dist/Nimbus/* AppDir/usr/bin/

          # Desktop entry
          cat << 'EOF' > AppDir/usr/share/applications/nimbus.desktop
          [Desktop Entry]
          Name=Nimbus Browser
          Exec=Nimbus
          Icon=nimbus
          Type=Application
          Categories=Network;WebBrowser;
          EOF

          # Extrai/copia o ícone principal covertendo ICO para PNG (formato exigido pelo linuxdeploy)
          convert assets/nimbus_icon.ico[0] AppDir/usr/share/icons/hicolor/256x256/apps/nimbus.png || echo "Ico to png conversion failed, creating empty placeholder" && touch AppDir/usr/share/icons/hicolor/256x256/apps/nimbus.png

          export QMAKE=/usr/lib/qt5/bin/qmake
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e AppDir/usr/bin/Nimbus -i AppDir/usr/share/icons/hicolor/256x256/apps/nimbus.png -d AppDir/usr/share/applications/nimbus.desktop --output appimage
          mkdir -p dist-installer
          mv Nimbus_Browser*.AppImage dist-installer/Nimbus-Browser-v${{ env.VERSION }}-x86_64.AppImage

      - name: Package Portable Tarball (.tar.gz)
        run: |
          cd dist
          tar -czvf ../dist-installer/Nimbus-Browser-v${{ env.VERSION }}-linux-portable.tar.gz Nimbus/
          cd ..

      - name: Package Debian (.deb)
        run: |
          # Prepara estrutura do pacote Debian
          mkdir -p DebDir/usr/lib/nimbus-browser
          mkdir -p DebDir/usr/bin
          mkdir -p DebDir/usr/share/applications
          mkdir -p DebDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p DebDir/DEBIAN

          # Copia binários
          cp -r dist/Nimbus/* DebDir/usr/lib/nimbus-browser/
          
          # Cria link simbólico para o executável
          ln -s /usr/lib/nimbus-browser/Nimbus DebDir/usr/bin/nimbus-browser

          # Cria atalho (Desktop Entry)
          cat << 'EOF' > DebDir/usr/share/applications/nimbus-browser.desktop
          [Desktop Entry]
          Name=Nimbus Browser
          Exec=nimbus-browser
          Icon=nimbus-browser
          Type=Application
          Categories=Network;WebBrowser;
          EOF

          # Copia ícone PNG
          cp AppDir/usr/share/icons/hicolor/256x256/apps/nimbus.png DebDir/usr/share/icons/hicolor/256x256/apps/nimbus-browser.png || true

          # Cria arquivo de controle (DEBIAN/control)
          # A versão no dpkg não permite "v", remover "v" se existir
          CLEAN_VERSION=$(echo "${{ env.VERSION }}" | sed 's/^v//')
          cat << EOF > DebDir/DEBIAN/control
          Package: nimbus-browser
          Version: ${CLEAN_VERSION}
          Section: web
          Priority: optional
          Architecture: amd64
          Maintainer: Nimbus Developer <dev@nimbus.local>
          Description: Nimbus Browser
           Navegador web moderno, focado em privacidade, feito em Python e QtWebEngine.
          EOF

          # Constrói o .deb usando fakeroot para permissões corretas
          fakeroot dpkg-deb --build DebDir dist-installer/nimbus-browser-v${{ env.VERSION }}-amd64.deb

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nimbus-Linux-Packages
          path: |
            dist-installer/*.AppImage
            dist-installer/*.tar.gz
            dist-installer/*.deb
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-installer/*.AppImage
            dist-installer/*.tar.gz
            dist-installer/*.deb
          generate_release_notes: true
